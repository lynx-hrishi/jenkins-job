services:

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
    - 8080:80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - jenkins
  jenkins-blueocean:
    image: myjenkins-blueocean:2.555.2-1
    group_add:
      - "988"
    restart: on-failure
    # environment:
    #   DOCKER_HOST: tcp://docker:2376
    #   DOCKER_CERT_PATH: /certs/client
    #   DOCKER_TLS_VERIFY: 1
    volumes:
      - jenkins-data:/var/jenkins_home
      # - jenkins-docker-certs:/certs/client:ro
      - jenkins-volume:/etc
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8081:8080"
      - "50000:50000"
    networks:
      - jenkins

  # server-2:
  #   image: ubuntu
  #   command: tail -f /dev/null
  #   volumes:
  #     - jenkins-data:/var/jenkins_home
  #     - server2-volume:/etc
  #   networks:
  #     - jenkins
  #   ports:
  #     - "8008:80"

networks:
  jenkins:
    external: true

volumes:
  jenkins-data:
    external: true
  jenkins-docker-certs:
    external: true
  jenkins-volume:
    external: true
  # server2-volume:
  #   external: true